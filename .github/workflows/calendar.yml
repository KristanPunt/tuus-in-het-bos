name: Agenda bijwerken
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python update_calendar.py
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          ICAL_URL_NATUURHUISJE: ${{ secrets.ICAL_URL_NATUURHUISJE }}
      - run: |
          git config user.name "agenda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add availability.json
          git diff --cached --quiet || (git commit -m "Agenda bijgewerkt" && git push)
